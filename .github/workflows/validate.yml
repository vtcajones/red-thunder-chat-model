name: Validate model source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/chat-context-model.py validate
      - run: python -m unittest discover -s scripts/tests -p test_chat_context_model.py -v
